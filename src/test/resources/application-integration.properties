# Интеграционные тесты: отдельная БД, чистая схема из JPA-сущностей.
# Перед первым запуском: docker exec dvizh-postgres psql -U dvizh -d postgres -c "CREATE DATABASE events_it;"
spring.datasource.url=jdbc:postgresql://localhost:5433/events_it
spring.datasource.username=dvizh
spring.datasource.password=dvizh

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
